<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Savely</title>
    <link rel="stylesheet" href="./reader.css" />
  </head>
  <body>
    <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress__bar"></div></div>

    <nav class="bar">
      <button id="back" class="ghost" type="button">&larr; List</button>
      <div class="bar__group">
        <button id="favorite" class="ghost" type="button" aria-pressed="false" title="Favorite (f)" aria-label="Favorite">&#9734;</button>
        <button id="archive" class="ghost" type="button" aria-pressed="false" title="Archive (a)" aria-label="Archive">&#9636;</button>
        <a id="original" class="ghost" href="#" target="_blank" rel="noopener noreferrer" title="Open original (o)">&#8599;</a>
        <button id="settings-toggle" class="ghost" type="button" aria-expanded="false" title="Appearance">Aa</button>
      </div>
    </nav>

    <div id="settings" class="settings" hidden>
      <div class="settings__row">
        <span class="settings__label">Size</span>
        <div class="settings__group">
          <button class="ghost" type="button" data-font-size="-1" aria-label="Smaller text">A&minus;</button>
          <output id="font-size-value" class="settings__value">18</output>
          <button class="ghost" type="button" data-font-size="1" aria-label="Larger text">A+</button>
        </div>
      </div>

      <div class="settings__row">
        <span class="settings__label">Typeface</span>
        <div class="settings__group" role="group">
          <button class="ghost" type="button" data-font-family="serif">Serif</button>
          <button class="ghost" type="button" data-font-family="sans">Sans-serif</button>
          <button class="ghost" type="button" data-font-family="dyslexia">Dyslexia</button>
        </div>
      </div>

      <div class="settings__row">
        <span class="settings__label">Width</span>
        <div class="settings__group">
          <button class="ghost" type="button" data-column="-6" aria-label="Narrower column">&#8592;&#8594;</button>
          <output id="column-value" class="settings__value">68</output>
          <button class="ghost" type="button" data-column="6" aria-label="Wider column">&#8594;&#8592;</button>
        </div>
      </div>

      <div class="settings__row">
        <span class="settings__label">Theme</span>
        <div class="settings__group" role="group">
          <button class="ghost" type="button" data-theme-choice="light">Light</button>
          <button class="ghost" type="button" data-theme-choice="sepia">Sepia</button>
          <button class="ghost" type="button" data-theme-choice="dark">Dark</button>
          <button class="ghost" type="button" data-theme-choice="auto">Auto</button>
        </div>
      </div>

      <label class="settings__check">
        <input id="remote-images" type="checkbox" />
        Don&rsquo;t load remote images
      </label>
    </div>

    <main id="article" class="article"><p class="loading">Loading&hellip;</p></main>

    <div id="popover" class="popover" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="./reader.ts"></script>
  </body>
</html>
