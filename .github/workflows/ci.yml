# Savely CI: quality -> build both variants -> packages on a tag.
#
# The split into three jobs is deliberate: `check` should be fast and run on
# every push, `e2e` pulls Chromium (~150 MB), and `release` only makes sense on
# a tag and must not start until the first two pass.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build (chrome + firefox)
        run: npm run build

      # The manifest and bundle through AMO's eyes. Zero errors is the pass
      # condition; warnings from dependency bundles are known and documented in
      # the README.
      - name: web-ext lint (dist/firefox)
        run: npm run lint:ext

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Chromium + extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Extensions load only into full Chromium, not into the headless shell.
      - name: Playwright + Chromium
        run: npm run e2e:install

      - name: Build (chrome)
        run: npm run build:chrome

      - name: Playwright
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Store packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The version in the manifest comes from package.json - the tag has to
      # match it, otherwise the store would get a package whose version differs
      # from the tag name.
      - name: Tag version matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $PKG in package.json." >&2
            exit 1
          fi

      - name: Build + packages
        run: |
          npm run build
          npm run pack
          npm run pack:source

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: |
            artifacts/chrome.zip
            artifacts/firefox.zip
            artifacts/source.zip
          retention-days: 90

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Savely $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/chrome.zip artifacts/firefox.zip artifacts/source.zip
