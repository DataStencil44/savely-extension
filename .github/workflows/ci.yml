# CI Savely: jakość -> build obu wariantów -> paczki przy tagu.
#
# Podział na trzy zadania jest celowy: `check` ma być szybki i odpalać się przy
# każdym pushu, `e2e` ciągnie Chromium (~150 MB), a `release` ma sens wyłącznie
# przy tagu i nie może ruszyć, dopóki dwa poprzednie nie przejdą.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, testy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build (chrome + firefox)
        run: npm run build

      # Manifest i bundle oczami AMO. Zero błędów jest warunkiem przejścia;
      # ostrzeżenia z bundli zależności są znane i opisane w README.
      - name: web-ext lint (dist/firefox)
        run: npm run lint:ext

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Chromium + rozszerzenie)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Rozszerzenia ładują się tylko do pełnego Chromium, nie do headless shella.
      - name: Playwright + Chromium
        run: npm run e2e:install

      - name: Build (chrome)
        run: npm run build:chrome

      - name: Playwright
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Paczki do sklepów
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Wersja w manifeście bierze się z package.json - tag musi się z nią
      # zgadzać, inaczej sklep dostałby paczkę z inną wersją niż w nazwie tagu.
      - name: Wersja tagu zgadza się z package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME nie pasuje do wersji $PKG w package.json." >&2
            exit 1
          fi

      - name: Build + paczki
        run: |
          npm run build
          npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: |
            artifacts/chrome.zip
            artifacts/firefox.zip
          retention-days: 90

      - name: Wydanie GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Savely $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/chrome.zip artifacts/firefox.zip
